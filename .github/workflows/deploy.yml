name: test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request makes its older runs moot. Pushes, and above all main, are never
# cancelled by another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub's own machines: free for a public repository, and unlike the Mac's runners they're safe to hand
# pull requests from strangers. ubuntu-latest has Chrome at /usr/bin/google-chrome, where e2e/run.mjs looks.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e/shots/
          retention-days: 7

  # Only main deploys, and only after the tests pass. Needs the repository secrets CLOUDFLARE_API_TOKEN
  # (Cloudflare's "Edit Cloudflare Workers" template, limited to this account and fayelore.com; see
  # docs/deploy.md) and CLOUDFLARE_ACCOUNT_ID. Secrets never reach pull requests.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Not deployed: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/deploy.md)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy
      - name: Check the live site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://muster.fayelore.com/)
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::https://muster.fayelore.com/ answered $code"; exit 1
